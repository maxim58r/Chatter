apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: kibana-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: elastic-admin  # Или другая роль с правами на чтение данных
subjects:
  - kind: ServiceAccount
    name: kibana-sa
    namespace: logging