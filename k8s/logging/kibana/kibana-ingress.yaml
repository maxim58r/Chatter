apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kibana-ingress
  namespace: logging
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/backend-protocol: "HTTPS"
    nginx.ingress.kubernetes.io/proxy-ssl-verify: "off"
    nginx.ingress.kubernetes.io/proxy-ssl-server-name: "kibana.msv-tech.ru"
    nginx.ingress.kubernetes.io/proxy-ssl-name: "kibana.msv-tech.ru"
  # Возможно, ещё proxy-ssl-secret для CA

spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - kibana.msv-tech.ru
      secretName: kibana-msv-tech-tls
  rules:
    - host: kibana.msv-tech.ru
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kibana-kb-http
                port:
                  number: 5601
