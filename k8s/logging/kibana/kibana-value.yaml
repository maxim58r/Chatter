apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  serviceAccountName: kibana-sa
  elasticsearchRef:
    name: elastic

  config:
    elasticsearch.hosts:
      - "https://elastic-es-http.logging.svc.cluster.local:9200"
    elasticsearch.ssl.verificationMode: "full"
    elasticsearch.ssl.certificateAuthorities:
      - "/usr/share/kibana/config/certs/tls.crt"

  podTemplate:
    spec:
      containers:
        - name: kibana
          resources:
            requests:
              memory: 2Gi
              cpu: 500m
            limits:
              memory: 3Gi
              cpu: 1
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /usr/share/kibana/config/certs
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: elastic-es-http-certs-public
