apiVersion: v1
kind: ConfigMap
metadata:
  name: logstash-pipeline
  namespace: logging
data:
  logstash.conf: |-
    input {
      tcp {
        port => 30429
        codec => json_lines {
          charset => "UTF-8"
          target => "log"
        }
      }

      tcp {
        port => 5044
        codec => json_lines {
          charset => "UTF-8"
          target => "log"
        }
      }
    }

    filter {
      # Проверка наличия поля message
      if [message] {
        # Отбрасываем бинарные данные
        if [message] =~ /\\x[0-9A-Fa-f]{2}|\\u0000|\\u0016|\\u0001/ {
          drop { }
        }

        # Отбрасываем слишком короткие или длинные сообщения
        if (strlen([message]) < 3 or strlen([message]) > 10000) {
          drop { }
        }
      }

      # Удаляем записи с ошибками парсинга JSON
      if "_jsonparsefailure" in [tags] {
        drop { }
      }
    }

    output {
      elasticsearch {
        hosts => ["https://elastic-es-http.logging.svc.cluster.local:9200"]
        index => "spring-logs-%{+YYYY.MM.dd}"
        user => "${ES_USERNAME}"
        password => "${ES_PASSWORD}"
        ssl => true
        ssl_certificate_verification => false
      }
    }
