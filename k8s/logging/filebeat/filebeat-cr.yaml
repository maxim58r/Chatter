apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging
spec:
  type: filebeat
  version: 8.5.1
  elasticsearchRef:
    name: elastic
  config:
    logging.level: debug
    logging.selectors: ["*"]
    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          include_namespaces: ["default"]
          hints.enabled: true
          hints.default_config:
            type: container
            paths:
#              - /var/log/containers/*${kubernetes.container.id}.log
              - /var/log/containers/*{{`{{.kubernetes.container.id}}`}}*.log
#              - /var/log/containers/*${data.kubernetes.container.id}.log
            # Добавлены настройки для JSON-логов
#            json.keys_under_root: true
#            json.add_error_key: true
            start_position: beginning

    processors:
      - add_host_metadata: {}
      - add_cloud_metadata: {}
      - add_kubernetes_metadata:
          in_cluster: true
#          target: data.kubernetes
#      - decode_json_fields:
#          fields: ["message"]
#          target: ""
#          overwrite_keys: true

    output.elasticsearch:
      hosts: ["https://elastic-es-http.logging.svc.cluster.local:9200"]  # Используем DNS-имя сервиса
      username: "${ELASTICSEARCH_USERNAME}"  # Используем переменную окружения
      password: "${ELASTICSEARCH_PASSWORD}"  # Используем переменную окружения
      ssl.verification_mode: none
#    output.console:
#      pretty: true

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat-sa
        securityContext:
          runAsUser: 0
          runAsGroup: 1000
          fsGroup: 1000

        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3607
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace

        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0
              privileged: true  # Для доступа к логам
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: KUBERNETES_SERVICE_HOST
                value: "kubernetes.default.svc"
              - name: KUBERNETES_SERVICE_PORT
                value: "443"
              # Добавляем переменные окружения для Elasticsearch
              - name: ELASTICSEARCH_HOSTS
                value: "https://elastic-es-http.logging.svc.cluster.local:9200"
              - name: ELASTICSEARCH_USERNAME
                value: "elastic"
              - name: ELASTICSEARCH_PASSWORD
                value: "5LtfVTJc002wyaI499n4oj45"
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true