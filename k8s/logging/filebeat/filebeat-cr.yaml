apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging
spec:
  type: filebeat
  version: 8.5.1

  elasticsearchRef:
    name: elastic

  config:
    filebeat.yml: |-
      # Включаем перезагрузку конфигурации
      config.reload.enabled: true
      config.reload.period: 10s

      # Явно указываем входные данные для контейнеров
      filebeat.inputs:
        - type: container
          paths:
            - /var/log/containers/*.log
          processors:
            - add_kubernetes_metadata:
                host: ${NODE_NAME}
                namespace: default

      # Автодискаверинг Kubernetes (дополнительно)
      filebeat.autodiscover:
        providers:
          - type: kubernetes
            node: ${NODE_NAME}
            hints.enabled: true
            hints.default_config:
              type: container
              paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log

      processors:
        - add_host_metadata: {}
        - add_cloud_metadata: {}

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat-sa
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        volumes:
          - name: filebeat-data
            emptyDir: {}
          # Монтируем директорию с логами контейнеров
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers
        containers:
          - name: filebeat
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            volumeMounts:
              - name: filebeat-data
                mountPath: /usr/share/filebeat/data
              - name: varlogcontainers
                mountPath: /var/log/containers
                readOnly: true