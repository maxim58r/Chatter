apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging
spec:
  type: filebeat
  version: 8.5.1
  elasticsearchRef:
    name: elastic
  config:
    logging.level: debug
    logging.selectors: ["*"]

    setup.dashboards.enabled: true
    setup.kibana.host: "https://kibana-kb-http.logging.svc.cluster.local:5601"
    setup.kibana.username: "elastic"
    setup.kibana.password: "5LtfVTJc002wyaI499n4oj45"
    setup.kibana.ssl.verification_mode: none

    filebeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          scope: cluster # Для мониторинга всех нод
          templates:
            - condition:
                equals:
                  kubernetes.namespace: "default"
              config:
                - type: container
                  paths:
                    - /var/log/containers/*.log
                  # Раскомментируйте, если логи в формате JSON
                  # json.keys_under_root: true
                  # json.add_error_key: true
                  start_position: beginning

    processors:
      - add_host_metadata: {}
      - add_cloud_metadata: {}
      - add_kubernetes_metadata:
          in_cluster: true
          # Добавьте namespace для метаданных
          namespace: ${POD_NAMESPACE}

    output.elasticsearch:
      hosts: ["https://elastic-es-http.logging.svc.cluster.local:9200"]
      username: "${ELASTICSEARCH_USERNAME}"
      password: "${ELASTICSEARCH_PASSWORD}"
      ssl.verification_mode: none

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat-sa
        securityContext:
          runAsUser: 0
        volumes:
          - name: varlog
            hostPath:
              path: /var/log
              type: Directory
          - name: kube-api-access
            projected:
              sources:
                - serviceAccountToken:
                    path: token
                    expirationSeconds: 3607
                - configMap:
                    name: kube-root-ca.crt
                    items:
                      - key: ca.crt
                        path: ca.crt
                - downwardAPI:
                    items:
                      - path: namespace
                        fieldRef:
                          fieldPath: metadata.namespace
        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0
              privileged: true
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
              - name: POD_NAMESPACE
                valueFrom:
                  fieldRef:
                    fieldPath: metadata.namespace
              - name: KUBERNETES_SERVICE_HOST
                value: "kubernetes.default.svc"
              - name: KUBERNETES_SERVICE_PORT
                value: "443"
              - name: ELASTICSEARCH_HOSTS
                value: "https://elastic-es-http.logging.svc.cluster.local:9200"
              - name: ELASTICSEARCH_USERNAME
                value: "elastic"
              - name: ELASTICSEARCH_PASSWORD
                value: "5LtfVTJc002wyaI499n4oj45"
            volumeMounts:
              - name: varlog
                mountPath: /var/log
                readOnly: true
              - name: kube-api-access
                mountPath: /var/run/secrets/kubernetes.io/serviceaccount
                readOnly: true