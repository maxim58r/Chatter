apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging
spec:
  type: filebeat
  version: 8.5.1

  # Ссылка на развернутый Elasticsearch (ECK) CR
  elasticsearchRef:
    name: elastic

  # Основная конфигурация Filebeat
  config:
    filebeat:
      autodiscover:
        providers:
          - type: kubernetes
            node: ${NODE_NAME}
            hints.enabled: true
            # при необходимости можно указать namespaces: ["default"]
            hints.default_config:
              type: container
              paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log
    processors:
      - add_host_metadata: {}
      - add_cloud_metadata: {}

  # Описываем DaemonSet, чтобы Filebeat запускался на каждом узле
  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat-sa
        securityContext:
          # Параметры можно менять в зависимости от того,
          # какая нужна UID/GID для доступа к /var/log/... на хосте
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000

        # Монтируем нужные хостовые каталоги
        volumes:
          - name: varlogcontainers
            hostPath:
              path: /var/log/containers

        containers:
          - name: filebeat
            securityContext:
              runAsUser: 0
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            volumeMounts:
              - name: varlogcontainers
                mountPath: /var/log/containers
