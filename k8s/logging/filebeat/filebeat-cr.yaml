apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: filebeat
  namespace: logging
spec:
  type: filebeat
  version: 8.5.1

  # Ссылка на Elasticsearch CR, развернутый ECK
  elasticsearchRef:
    name: elastic

  config:
    filebeat.yml: |-
      filebeat.autodiscover:
        providers:
          - type: kubernetes
            node: ${NODE_NAME}
            hints.enabled: true
            namespaces: ["default"]
            # ВАЖНО: благодаря этому блоку Filebeat будет собирать логи
            # подов без аннотаций "co.elastic.logs/*" — он применится по умолчанию.
            hints.default_config:
              type: container
              paths:
                - /var/log/containers/*${data.kubernetes.container.id}.log

      processors:
        - add_host_metadata: {}
        - add_cloud_metadata: {}

      # Если хотите явно прописать output (логин, пароль) — раскомментируйте ниже.
      # Иначе ECK сам подставит сервисный аккаунт/секрет.
      #
      # output.elasticsearch:
      #   hosts: ["https://elastic-es-http.logging.svc:9200"]
      #   username: "elastic"
      #   password: "SUPER-SECRET"
      #   ssl.verification_mode: "certificate"
      #   certificate_authorities: ["/usr/share/filebeat/certs/ca.crt"]

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: filebeat-sa
        securityContext:
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
        volumes:
          - name: filebeat-data
            emptyDir: {}
        containers:
          - name: filebeat
            securityContext:
              runAsUser: 1000
              runAsGroup: 1000
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            volumeMounts:
              - name: filebeat-data
                mountPath: /usr/share/filebeat/data
