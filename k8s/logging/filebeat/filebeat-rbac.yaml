apiVersion: v1
kind: ServiceAccount
metadata:
  name: filebeat-sa
  namespace: logging
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: filebeat-sa-binding
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: elastic-agent # Используем встроенную роль Elastic
subjects:
  - kind: ServiceAccount
    name: filebeat-sa
    namespace: logging