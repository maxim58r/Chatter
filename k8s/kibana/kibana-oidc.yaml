replicaCount: 1

##########################################################
# Подключаемся к ES по HTTPS
##########################################################
elasticsearch:
  hosts:
    - "https://elasticsearch-master"
  port: 9200
  security:
    auth:
      enabled: true
      existingSecret: "elasticsearch-master-credentials"
      elasticsearchPasswordSecret: "elasticsearch-master-credentials"
logging.verbose: true

service:
  type: NodePort
  ports:
    http: 5601
  nodePorts:
    http: 30081

##########################################################
# Конфигурация kibana.yml
##########################################################
kibanaConfig:
  kibana.yml: |
    server.publicBaseUrl: "https://msv-tech.ru"
    elasticsearch.ssl.certificateAuthorities: /usr/share/kibana/config/certs/ca.crt
    elasticsearch.ssl.verificationMode: full

    xpack.security.authc.providers:
      oidc.oidc1:
        order: 0
        realm: "oidc1"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "1Gi"
