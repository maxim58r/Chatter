apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  elasticsearchRef:
    name: elastic
  serviceAccountRef:
    name: kibana-sa  # Название сервисного аккаунта для Kibana

  config:
    elasticsearch.hosts: ["https://elastic-es-http.logging.svc:9200"]
    elasticsearch.ssl.verificationMode: full
    xpack.reporting.kibanaServer.hostname: localhost
    server.ssl.enabled: true
    elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/es-certs/ca.crt"]
    server.ssl.certificate: /usr/share/kibana/config/kibana-certs/tls.crt
    server.ssl.key: /usr/share/kibana/config/kibana-certs/tls.key

    xpack.security.authc.providers:
      basic.basic1:
        order: 0

  podTemplate:
    spec:
      serviceAccountName: kibana-sa  # Используем созданный сервисный аккаунт
      containers:
        - name: kibana
          volumeMounts:
            - name: es-ca
              mountPath: /usr/share/kibana/config/es-certs
            - name: kibana-cert
              mountPath: /usr/share/kibana/config/kibana-certs
      volumes:
        - name: es-ca
          secret:
            secretName: elastic-tls-secret
        - name: kibana-cert
          secret:
            secretName: kibana-msv-tech-tls
