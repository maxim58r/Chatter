apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  config:
    elasticsearch.hosts:
      - "https://elastic-es-http.logging.svc:9200"
    elasticsearch.serviceAccountToken: "AAEAAWVsYXN0aWMva2liYW5hL2tpYmFuYS10b2tlbjpKWnVzT2E1LVJPdVpLMFRuQTZwTDN3"
    elasticsearch.ssl.verificationMode: "full"
    elasticsearch.ssl.certificateAuthorities:
      - "/usr/share/kibana/config/certs/tls.crt"
  podTemplate:
    spec:
      containers:
        - name: kibana
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /usr/share/kibana/config/certs
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: elastic-es-http-certs-public
