apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  elasticsearchRef:
    name: elastic
  secureSettings:
    - secretName: kibana-oidc-secure-settings
  config:
    elasticsearch.hosts: ["https://msv-tech.ru:9200"]
    elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]
    elasticsearch.ssl.verificationMode: full
    xpack.reporting.kibanaServer.hostname: localhost
    server.ssl.enabled: true
    server.ssl.certificate: /usr/share/kibana/config/certs/tls.crt
    server.ssl.key: /usr/share/kibana/config/certs/tls.key

  podTemplate:
    spec:
      containers:
        - name: kibana
          volumeMounts:
            - name: es-ca
              mountPath: /usr/share/kibana/config/certs
            - name: kibana-cert
              mountPath: /usr/share/kibana/config/certs
      volumes:
        - name: es-ca
          secret:
            secretName: elastic-tls-secret
        - name: kibana-cert
          secret:
            secretName: kibana-msv-tech-tls
