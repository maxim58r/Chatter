apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  elasticsearchRef:
    name: elastic
  secureSettings:
    - secretName: kibana-oidc-secure-settings
  config:
    # Указываем, что для подключения к ES используется HTTPS и доверенный CA
    elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]
    elasticsearch.ssl.verificationMode: full
    # Настройка OIDC-реалма для Kibana
    xpack.security.authc.oidc.oidc1:
      client_id: "kibana"
      base_redirect_url: "https://kibana.msv-tech.ru"
      response_type: "code"
      requested_scopes: ["openid", "profile", "email"]
      authorization_endpoint: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/auth"
      token_endpoint: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/token"
      userinfo_endpoint: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/userinfo"
      jwkset_path: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/certs"
      post_logout_redirect_uri: "https://msv-tech.ru/"
  podTemplate:
    spec:
      containers:
        - name: kibana
          volumeMounts:
            - name: es-ca
              mountPath: /usr/share/kibana/config/certs
      volumes:
        - name: es-ca
          secret:
            secretName: elastic-tls-secret
