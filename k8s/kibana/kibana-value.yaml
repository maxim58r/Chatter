apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  config:
    elasticsearch.hosts:
      - "https://elasticsearch-es-http:9200"   # URL сервиса Elasticsearch (кластер "elasticsearch")
    elasticsearch.ssl.certificateAuthorities:
      - "/usr/share/kibana/config/certs/ca.crt"  # путь до CA
  secureSettings:
    - secretName: kibana-service-token           # секрет с токеном сервис-аккаунта
  podTemplate:
    spec:
      containers:
        - name: kibana
          env:
            - name: ELASTICSEARCH_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kibana-service-token  # Берём токен из секрета
                  key: token
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /usr/share/kibana/config/certs   # Монтируем папку с CA
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: elastic-es-http-certs-public  # Используем правильное имя секрета
