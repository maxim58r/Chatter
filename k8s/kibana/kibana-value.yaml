apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  elasticsearchRef:
    name: elastic
  secureSettings:
    - secretName: kibana-oidc-secure-settings
  config:
    # Указываем, что для подключения к ES используется HTTPS и доверенный CA
    elasticsearch.ssl.certificateAuthorities: ["/usr/share/kibana/config/certs/ca.crt"]
    elasticsearch.ssl.verificationMode: full
    # Настройка OIDC-реалма для Kibana
  podTemplate:
    spec:
      containers:
        - name: kibana
          volumeMounts:
            - name: es-ca
              mountPath: /usr/share/kibana/config/certs
      volumes:
        - name: es-ca
          secret:
            secretName: elastic-tls-secret
