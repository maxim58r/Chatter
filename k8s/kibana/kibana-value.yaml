apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: logging-kibana              # имя Kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  config:
    elasticsearch.hosts:
      - "https://elasticsearch-es-http:9200"   # URL сервиса Elasticsearch (кластер "elasticsearch")
    elasticsearch.ssl.certificateAuthorities: /usr/share/kibana/config/certs/ca.crt  # путь до CA
    # Примечание: elasticsearch.serviceAccountToken не указываем в явном виде – он будет загружен из secureSettings.
  secureSettings:
    - secretName: kibana-service-token           # секрет с токеном сервис-аккаунта (elasticsearch.serviceAccountToken)
  podTemplate:
    spec:
      containers:
        - name: kibana
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /usr/share/kibana/config/certs   # монтируем папку с сертификатом CA
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: elasticsearch-es-http-certs-public  # секрет с CA Elasticsearch (сгенерирован ECK)
