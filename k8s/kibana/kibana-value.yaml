apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  config:
    elasticsearch.hosts:
      - "https://elastic-es-http.logging.svc:9200"
    elasticsearch.username: "elastic"
    elasticsearch.password: "A5a6ZM5Kh34C0o8Z26oZOK1g"
    elasticsearch.ssl.verificationMode: "none"  # Отключаем проверку SSL
  podTemplate:
    spec:
      containers:
        - name: kibana
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /usr/share/kibana/config/certs
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: elastic-es-http-certs-public
