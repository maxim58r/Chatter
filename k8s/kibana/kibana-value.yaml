apiVersion: kibana.k8s.elastic.co/v1
kind: Kibana
metadata:
  name: kibana
  namespace: logging
spec:
  version: 8.5.1
  count: 1
  config:
    elasticsearch.hosts:
      - "https://elastic-es-http:9200"
    elasticsearch.ssl.certificateAuthorities:
      - "/usr/share/kibana/config/certs/ca.crt"
  podTemplate:
    spec:
      containers:
        - name: kibana
          env:
            - name: ELASTICSEARCH_SERVICE_ACCOUNT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: kibana-service-token
                  key: token
          volumeMounts:
            - name: elasticsearch-ca
              mountPath: /usr/share/kibana/config/certs
              readOnly: true
      volumes:
        - name: elasticsearch-ca
          secret:
            secretName: elastic-es-http-certs-public
