apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elastic
  namespace: logging
spec:
  version: 8.5.1

  # 1. HTTP TLS (REST API) с пользовательским сертификатом
  http:
    tls:
      certificate:
        secretName: elastic-tls-secret
        # В этом секрете: tls.key + tls.crt (+ ca.crt при необходимости)

  # 2. Transport TLS (опционально, если нужен свой сертификат)
  # По умолчанию ECK генерирует self-signed для transport.
  # Если хочешь свой:
  # transport:
  #   tls:
  #     certificate:
  #       secretName: elastic-transport-tls
  #       # секрет с tls.crt, tls.key и при необходимости ca.crt

  nodeSets:
    - name: default
      count: 2
      config:
        # Если хочешь OIDC, добавь:
        xpack.security.authc.token.enabled: true

        xpack.security.authc.realms.oidc.oidc1:
          enabled: true
          order: 10
          rp.client_id: "kibana"
          rp.response_type: "code"
          rp.requested_scopes: ["openid", "profile", "email"]
          rp.redirect_uri: "https://kibana.msv-tech.ru/oauth2/callback"
          rp.post_logout_redirect_uri: "https://msv-tech.ru/"
          op.issuer: "https://msv-tech.ru/realms/Chatter"
          op.authorization_endpoint: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/auth"
          op.token_endpoint: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/token"
          op.jwkset_path: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/certs"
          op.userinfo_endpoint: "https://msv-tech.ru/realms/Chatter/protocol/openid-connect/userinfo"
          claims.principal: "sub"

      podTemplate:
        spec:
          containers:
            - name: elasticsearch
              # При использовании http.tls.certificate.secretName,
              # ECK автоматически монтирует секрет в нужное место.
              # Если нужен OIDC с кастомным CA:
              #   volumeMounts:
              #     - name: oidc-ca
              #       mountPath: /usr/share/elasticsearch/config/oidc-ca
          volumes:
          # Только если надо смонтировать кастомный CA для OIDC
          # - name: oidc-ca
          #   secret:
          #     secretName: elastic-ca-secret

      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
