apiVersion: elasticsearch.k8s.elastic.co/v1
kind: Elasticsearch
metadata:
  name: elastic
  namespace: logging
spec:
  version: 8.5.1

  # Здесь мы говорим ECK, что нужно создать пользователей из этих Secret
  auth:
    fileRealm:
      - secretName: elasticsearch-user-admin
      - secretName: elasticsearch-user-viewer
    roleMappings:
      - name: "adminuser_superuser_mapping"
        roles:
          - "superuser"     # встроенная роль с доступом к restricted indices
        users:
          - "adminuser"
        enabled: true
      - name: "vieweruser_viewer_mapping"
        roles:
          - "viewer"        # встроенная роль только для чтения
        users:
          - "vieweruser"
        enabled: true

  http:
    tls:
      selfSignedCertificate:
        disabled: false  # Генерировать самоподписанный сертификат для HTTPS
  nodeSets:
    - name: default
      count: 1
      config:
        xpack.security.enabled: true
        # Транспортный SSL ECK включает сам, здесь достаточно включить Security
      volumeClaimTemplates:
        - metadata:
            name: elasticsearch-data
          spec:
            accessModes: ["ReadWriteOnce"]
            resources:
              requests:
                storage: 1Gi
