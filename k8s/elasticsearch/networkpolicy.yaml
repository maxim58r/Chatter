apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-egress-kibana
  namespace: logging
spec:
  podSelector:
    matchLabels:
      kibana.k8s.elastic.co/name: kibana
  policyTypes:
    - Egress
  egress:
    - to:
        - ipBlock:
            cidr: 0.0.0.0/0
      ports:
        - protocol: TCP
          port: 443
    - to:
        - namespaceSelector: {}
        - podSelector:
            matchLabels:
              common.k8s.elastic.co/type: elasticsearch
      ports:
        - protocol: TCP
          port: 9200