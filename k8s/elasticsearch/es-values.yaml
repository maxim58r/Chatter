# Количество реплик и прочие базовые настройки
replicas: 2
minimumMasterNodes: 2
antiAffinity: "soft"
roles:
  - master
  - data
  - ingest

# Отключаем security и TLS внутри кластера
security:
  enabled: false
  tls:
    enabled: false

# Убираем keystore, если OIDC не нужен внутри
# keystore: (удаляем секцию)

# Основная конфигурация Elasticsearch
esConfig:
  elasticsearch.yml: |
    cluster.name: "elasticsearch"
    node.name: ${HOSTNAME}
    node.roles: ["master", "data", "ingest"]
    discovery.seed_hosts: ["elasticsearch-master-0", "elasticsearch-master-1"]
    cluster.initial_master_nodes: ["elasticsearch-master-0", "elasticsearch-master-1"]
    # Убираем все настройки xpack.security
    xpack.security.enabled: false

# PVC для данных
volumeClaimTemplate:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 1Gi

# Ресурсы
resources:
  requests:
    cpu: "250m"
    memory: "1Gi"
  limits:
    cpu: "500m"
    memory: "1Gi"