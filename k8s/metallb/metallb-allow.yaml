apiVersion: metallb.io/v1beta1
kind: IPAddressPool
metadata:
  name: local-lan-pool
  namespace: metallb-system
spec:
  addresses:
    - 192.168.1.240-192.168.1.250
  autoAssign: true
  avoidBuggyIPs: false
  avoidAddressSharing: false
  serviceAllocation:
    allowSharedIP: false
  # 👇 указываем разрешённые IP, где запущен MetalLB (k3s node)
  allowedAddresses:
    - 192.168.1.35/32
