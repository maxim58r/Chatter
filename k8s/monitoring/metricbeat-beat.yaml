apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: metricbeat
  namespace: logging       # Или где у вас хранится вся логика
spec:
  type: metricbeat
  version: 8.5.1           # Тот же, что у Elasticsearch
  elasticsearchRef:
    name: elastic          # Имя Elasticsearch, задеплоенного ECK
  kibanaRef:
    name: kibana           # Если хотите дашборды автоматически
  config:
    # Основная конфигурация metricbeat:
    metricbeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          # Охват всего кластера:
          scope: cluster
          templates:
            - condition:
                equals:
                  # Фильтруем по namespace / labels, если нужно
                  kubernetes.namespace: "default"
              config:
                - module: prometheus
                  period: 15s
                  hosts: ["${data.host}:8080"]
                  metrics_path: "/actuator/prometheus"
                  # Можно указать разный scheme (http/https), если нужно
                  # scheme: https
                  # Если нужно базовая аутентификация,
                  # добавьте username / password или etc.

    # Пример: если нужно дополнительно собирать метрики узлов k8s
    metricbeat.modules:
      - module: kubernetes
        metricsets:
          - node
          - system
          - pod
          - container
          - volume
        period: 10s
        host: "${NODE_NAME}"
        hosts: ["https://${NODE_NAME}:10250"]  # при использовании secure kubelet
        ssl.verification_mode: none            # если самоподписанные сертификаты

    # если хотите отладки
    # logging.level: debug
    setup.ilm.enabled: false  # Зависит от того, как вы управляете индексами

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: metricbeat-sa  # Создайте ServiceAccount при необходимости
        containers:
          - name: metricbeat
            resources:
              limits:
                memory: 200Mi
              requests:
                cpu: 100m
                memory: 100Mi
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
