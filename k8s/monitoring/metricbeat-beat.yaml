apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: metricbeat
  namespace: logging
spec:
  type: metricbeat
  version: 8.5.1
  elasticsearchRef:
    name: elastic
  kibanaRef:
    name: kibana
  config:
    metricbeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          templates:
            - condition:
                contains:
                  kubernetes.pod.name: "authservice"
                equals:
                  kubernetes.namespace: "default"
              config:
                - module: prometheus
                  period: 15s
                  hosts: ["localhost:8080"]
                  metrics_path: "/actuator/prometheus"

    metricbeat.modules:
      - module: system
        metricsets:
          - cpu
          - memory
          - network
          - filesystem
          - process
          - process_summary
        period: 10s
        processes: [".*"]
        cpu.metrics: ["percentages", "normalized_percentages"]

      - module: kubernetes
        metricsets:
          - node
          - pod
          - container
          - volume
          - state_pod
          - state_node
          - state_deployment
          - state_replicaset
          - state_container
        period: 10s
        hosts: ["https://${NODE_NAME}:10250"]
        bearer_token_file: /var/run/secrets/kubernetes.io/serviceaccount/token
        ssl.verification_mode: none
        kubernetes.ssl.certificate_authorities:
          - /var/run/secrets/kubernetes.io/serviceaccount/ca.crt

    setup.ilm.enabled: false

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: metricbeat-sa
        automountServiceAccountToken: true
        hostNetwork: true
        dnsPolicy: ClusterFirstWithHostNet
        containers:
          - name: metricbeat
            image: docker.elastic.co/beats/metricbeat:8.5.1
            args: ["-e", "-c", "/etc/beat.yml"]
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              limits:
                memory: 200Mi
              requests:
                cpu: 100m
                memory: 100Mi
            securityContext:
              runAsUser: 0
            volumeMounts:
              - name: config
                mountPath: /etc/beat.yml
                subPath: beat.yml
              - name: beat-data
                mountPath: /usr/share/metricbeat/data
        volumes:
          - name: config
            secret:
              secretName: metricbeat-beat-metricbeat-config
          - name: beat-data
            hostPath:
              path: /var/lib/logging/metricbeat/metricbeat-data
              type: DirectoryOrCreate