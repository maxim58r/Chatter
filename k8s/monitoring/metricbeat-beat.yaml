apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: metricbeat
  namespace: logging
spec:
  type: metricbeat
  version: 8.5.1
  elasticsearchRef:
    name: elastic
  kibanaRef:
    name: kibana
  config:
    metricbeat.autodiscover:
      providers:
        - type: kubernetes
          node: ${NODE_NAME}
          scope: cluster
          templates:
            - condition:
                equals:
                  kubernetes.namespace: "default"
              config:
                - module: prometheus
                  period: 15s
                  hosts: ["${data.host}:8080"]
                  metrics_path: "/actuator/prometheus"

    metricbeat.modules:
      - module: kubernetes
        metricsets:
          - node
          - system
          - pod
          - container
          - volume
        period: 10s
        hosts: ["https://${NODE_NAME}:10250"]
        ssl.verification_mode: none

    setup.ilm.enabled: false

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: metricbeat-sa
        containers:
          - name: metricbeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            securityContext:
              runAsUser: 0
            resources:
              limits:
                memory: 200Mi
              requests:
                cpu: 100m
                memory: 100Mi
