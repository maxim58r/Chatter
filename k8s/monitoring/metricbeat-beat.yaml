apiVersion: beat.k8s.elastic.co/v1beta1
kind: Beat
metadata:
  name: metricbeat
  namespace: logging
spec:
  type: metricbeat
  version: 8.5.1
  elasticsearchRef:
    name: elastic
  kibanaRef:
    name: kibana
  config:
    metricbeat.modules:
      - module: prometheus
        period: 15s
        hosts: ["http://kube-state-metrics.kube-system.svc.cluster.local:8080"]
        metrics_path: /metrics
        query:
          - help: "kube_.*"
        fields:
          service: kube-state-metrics

    setup.ilm.enabled: false

  daemonSet:
    podTemplate:
      spec:
        serviceAccountName: metricbeat-sa
        containers:
          - name: metricbeat
            env:
              - name: NODE_NAME
                valueFrom:
                  fieldRef:
                    fieldPath: spec.nodeName
            resources:
              limits:
                memory: 200Mi
              requests:
                cpu: 100m
                memory: 100Mi
  template:
    spec:
      containers:
        - name: metricbeat
          securityContext:
            runAsUser: 0
