replicaCount: 1

##########################################################
# Подключаемся к ES по HTTPS
##########################################################
elasticsearchHosts: "https://elasticsearch-master:9200"
elasticsearch:
  username: "kibana_system"
  password: "HJpZsxOvmLIZm6ih+V-m"

service:
  type: NodePort
  port: 5601
  nodePort: 30081  # наружный порт, если нужно внешнее подключение

##########################################################
# Конфигурация kibana.yml
##########################################################
kibanaConfig:
  kibana.yml: |
    server.publicBaseUrl: "https://kibana.chatter.com"
    elasticsearch.ssl.certificateAuthorities: /usr/share/kibana/config/certs/ca.crt
    elasticsearch.ssl.verificationMode: full

    # Указываем только OIDC-провайдер
    xpack.security.authc.providers: ["oidc1"]

    # Настройка OIDC-провайдера с идентификатором "oidc1"
    xpack.security.authc.oidc1.order: 1
    xpack.security.authc.oidc1.realm: "oidc1"
    xpack.security.authc.oidc1.client_id: "kibana-client"
    xpack.security.authc.oidc1.client_secret: "sAcCHLav7Q891svS8SmE27KLFNL2hwvr"
    xpack.security.authc.oidc1.authorization_endpoint: "https://keycloak.chatter.com/realms/Chatter/protocol/openid-connect/auth"
    xpack.security.authc.oidc1.token_endpoint: "https://keycloak.chatter.com/realms/Chatter/protocol/openid-connect/token"
    xpack.security.authc.oidc1.userinfo_endpoint: "https://keycloak.chatter.com/realms/Chatter/protocol/openid-connect/userinfo"
    xpack.security.authc.oidc1.jwkset_path: "https://keycloak.chatter.com/realms/Chatter/protocol/openid-connect/certs"
    xpack.security.authc.oidc1.logout_endpoint: "https://keycloak.chatter.com/realms/Chatter/protocol/openid-connect/logout"
    xpack.security.authc.oidc1.redirect_uri: "https://kibana.chatter.com/api/security/oidc/callback"

resources:
  requests:
    cpu: "500m"
    memory: "1Gi"
  limits:
    cpu: "1"
    memory: "1Gi"

########################################################################
# Включаем pre-install Token Creation (по умолчанию включён),
# и разрешаем чарту сам монтировать CA (или сделаем вручную).
########################################################################
preInstallTokenCreation:
  enabled: false
  automountElasticsearchCerts: false

########################################################################
# Настройка аутентификации через существующий секрет
########################################################################
auth:
  existingSecret: "kibana-token-secret"