apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: keycloak
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  rules:
    - host: msv-tech.ru
      http:
        paths:
          - path: "/"
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80
          - path: "/.well-known/acme-challenge/"
            pathType: Exact
            backend:
              service:
                name: cm-acme-http-solver-96wsm  # Подставь правильное имя сервиса
                port:
                  number: 8080
  tls:
    - hosts:
        - msv-tech.ru
      secretName: keycloak-tls
