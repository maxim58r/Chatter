service:
  type: NodePort
  ports:
    http: 80
    https: 8443
  nodePorts:
    http: 30221
    https: 30443

tls:
  enabled: true
  autoGenerated: false
  existingSecret: keycloak-tls-secret  # Используем существующий secret

ingress:
  enabled: true
  hostname: keycloak.chatter.com
  tls: true
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  rules:
    - host: keycloak.chatter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80  # Используем HTTP, так как Traefik сам занимается TLS

extraVolumes:
  - name: keycloak-tls-secret
    secret:
      secretName: keycloak-tls-secret

extraVolumeMounts:
  - name: keycloak-tls-secret
    mountPath: /opt/keycloak/certs
    readOnly: true

extraEnvVars:
  - name: KUBERNETES_NAMESPACE
    value: "keycloak"
  - name: BITNAMI_DEBUG
    value: "false"
  - name: KC_BOOTSTRAP_ADMIN_PASSWORD
    value: "admin"  # Укажи правильный пароль
  - name: KEYCLOAK_DATABASE_PASSWORD
    value: "your-db-password"  # Укажи правильный пароль БД
  - name: KC_SPI_ADMIN_REALM
    value: "keycloak"
  - name: KC_PROXY
    value: "edge"
  - name: KC_HOSTNAME
    value: "keycloak.chatter.com"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "true"
  - name: KC_HTTP_ENABLED
    value: "true"  # Включаем HTTP, чтобы работало через Ingress
  - name: KC_HTTPS_PORT
    value: "8443"
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: "/opt/keycloak/certs/tls.crt"
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: "/opt/keycloak/certs/tls.key"
  - name: KC_HTTP_RELATIVE_PATH
    value: "/auth"
