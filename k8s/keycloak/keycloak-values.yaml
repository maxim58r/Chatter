service:
  type: NodePort
  ports:
    http: 80
    https: 8443
  nodePorts:
    http: 30221
    https: 30443

image:
  debug: true

logging:
  output: default
  level: DEBUG

tls:
  enabled: true
  autoGenerated: false
  existingSecret: keycloak-secret-stores
  usePem: false
  truststorePassword: "maxim58r"
  passwordsSecret: "keycloak-secret-stores-passwords"

ingress:
  enabled: true
  hostname: keycloak.chatter.com
  tls: true
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  rules:
    - host: keycloak.chatter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80  # Используем HTTP, так как Traefik сам занимается TLS

extraVolumes:
  - name: keycloak-tls-secret
    secret:
      secretName: keycloak-tls-secret
  - name: keycloak-truststore
    secret:
      secretName: keycloak-secret-stores

extraVolumeMounts:
  - name: keycloak-tls-secret
    mountPath: /opt/bitnami/keycloak/certs
    readOnly: true
  - name: keycloak-truststore
    mountPath: /opt/bitnami/keycloak/certs
    readOnly: true