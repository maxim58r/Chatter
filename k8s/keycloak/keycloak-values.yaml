service:
  type: NodePort
  ports:
    http: 80
    https: 8443
  nodePorts:
    http: 30221
    https: 30443

image:
  debug: true
logging:
  output: default
  level: DEBUG

tls:
  enabled: true
  autoGenerated: false
  existingSecret: keycloak-tls-secret
  usePem: false
  truststoreFilename: "keycloak.truststore.jks"
  truststorePassword: "maxim58r"
  passwordsSecret: "keycloak-secret-stores-passwords"

ingress:
  enabled: true
  hostname: keycloak.chatter.com
  tls: true
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  rules:
    - host: keycloak.chatter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 80  # Используем HTTP, так как Traefik сам занимается TLS

extraVolumes:
  - name: keycloak-tls-secret
    secret:
      secretName: keycloak-tls-secret
  - name: keycloak-truststore
    secret:
      secretName: keycloak-secret-stores

extraVolumeMounts:
  - name: keycloak-tls-secret
    mountPath: /opt/bitnami/keycloak/certs
    readOnly: true
  - name: keycloak-truststore
    mountPath: /opt/bitnami/keycloak/certs/truststore
    readOnly: true

extraEnvVars:
  - name: KC_PROXY
    value: "edge"
  - name: KC_HOSTNAME
    value: "keycloak.chatter.com"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "true"
  - name: KC_HTTP_ENABLED
    value: "true"  # Включаем HTTP, чтобы работало через Ingress
  - name: KC_HTTPS_PORT
    value: "8443"
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: "/opt/keycloak/certs/tls.crt"
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: "/opt/keycloak/certs/tls.key"
  - name: KC_HTTP_RELATIVE_PATH
    value: "/auth"