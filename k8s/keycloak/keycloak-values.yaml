ingress:
  enabled: true  # Включаем Ingress для Keycloak
  ingressClassName: "nginx"  # Используем Nginx Ingress
  pathType: Prefix
  apiVersion: "networking.k8s.io/v1"
  controller: default
  hostname: msv-tech.ru
  hostnameStrict: false
  path: "/"
  servicePort: https  # Используем HTTPS
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt  # Настраиваем Let's Encrypt для автоматического получения сертификатов
    nginx.ingress.kubernetes.io/backend-protocol: "HTTP"
  tls: true  # Включаем TLS для HTTPS
  selfSigned: false
  extraTls:
    - hosts:
        - msv-tech.ru
      secretName: keycloak-tls  # Имя секрета для сертификата

service:
  type: ClusterIP
  http:
    enabled: true
  ports:
    http: 80
    https: 443
  nodePorts:
    http: "8080"
    https: "8443"

image:
  debug: true

logging:
  output: default
  level: DEBUG

existingSecret: keycloak-secret
