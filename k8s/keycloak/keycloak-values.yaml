service:
  type: NodePort
  ports:
    http: 80
    https: 8443
  nodePorts:
    http: 30221
    https: 30443

tls:
  enabled: true
  autoGenerated: false  # Используем свой TLS-секрет

ingress:
  enabled: true
  hostname: keycloak.chatter.com
  tls: true
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"
  rules:
    - host: keycloak.chatter.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: keycloak
                port:
                  number: 8443

extraVolumes:
  - name: keycloak-tls-secret
    secret:
      secretName: keycloak-tls-secret

extraVolumeMounts:
  - name: keycloak-tls-secret
    mountPath: /etc/x509/https
    readOnly: true

extraEnvVars:
  - name: KC_PROXY
    value: "edge"
  - name: KC_HOSTNAME
    value: "keycloak.chatter.com"
  - name: KC_HOSTNAME_STRICT
    value: "false"
  - name: KC_HOSTNAME_STRICT_HTTPS
    value: "true"
  - name: KC_HTTP_ENABLED
    value: "false"
  - name: KC_HTTPS_PORT
    value: "8443"
  - name: KC_HTTPS_CERTIFICATE_FILE
    value: "/etc/x509/https/tls.crt"
  - name: KC_HTTPS_CERTIFICATE_KEY_FILE
    value: "/etc/x509/https/tls.key"
