service:
  type: NodePort
  ports:
    http: 80
    https: 8443
  nodePorts:
    http: 30221
    https: 30443

image:
  debug: true

logging:
  output: default
  level: DEBUG

tls:
  enabled: true
  autoGenerated: false
  existingSecret: "keycloak-secret-stores"
  usePem: false
  truststorePassword: "maxim58r"
  keystorePassword: "maxim58r"
  passwordsSecret: "keycloak-secret-stores-passwords"

ingress:
  enabled: true
  hostname: keycloak.chatter.com
  path: /
  pathType: Prefix
#  tls: true
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"

extraVolumes:
  - name: certificates
    secret:
      defaultMode: 420
      secretName: keycloak-secret-stores
initContainers:
  - mountPath: /opt/bitnami/keycloak/certs
    name: certificates
    readOnly: true