service:
  type: NodePort
  ports:
    http: 80
    https: 8443
  nodePorts:
    http: 30221
    https: 30443

image:
  debug: true

logging:
  output: default
  level: DEBUG

tls:
  enabled: true
  autoGenerated: false
  existingSecret: keycloak-secret-stores
  usePem: false
  truststorePassword: "maxim58r"
  keystorePassword: "maxim58r"
  passwordsSecret: "keycloak-secret-stores-passwords"

customCaExistingSecret:

ingress:
  enabled: true
  hostname: keycloak.chatter.com
  path: /
  pathType: Prefix
  tls: true
  annotations:
    kubernetes.io/ingress.class: "traefik"
    traefik.ingress.kubernetes.io/router.entrypoints: "websecure"
    traefik.ingress.kubernetes.io/router.tls: "true"

extraVolumes:
  - name: keycloak-tls-secret
    secret:
      secretName: keycloak-tls-secret
  - name: keycloak-truststore
    secret:
      secretName: keycloak-secret-stores

extraVolumeMounts:
  - name: keycloak-tls-secret
    mountPath: /opt/bitnami/keycloak/certs
    readOnly: true
  - name: keycloak-truststore
    mountPath: /opt/bitnami/keycloak/certs
    readOnly: true