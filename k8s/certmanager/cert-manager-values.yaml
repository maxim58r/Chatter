apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt
spec:
  acme:
    email: maxim558r@gmail.com  # Укажи свой email
    server: https://acme-v02.api.letsencrypt.org/directory
