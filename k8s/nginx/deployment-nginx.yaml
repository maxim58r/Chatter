apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx
  namespace: keycloak
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx
  template:
    metadata:
      labels:
        app: nginx
    spec:
      containers:
        - name: nginx
          image: nginx:latest
          ports:
            - containerPort: 80
          volumeMounts:
            - name: acme-challenge
              mountPath: /usr/share/nginx/html/.well-known/acme-challenge
      volumes:
        - name: acme-challenge
          hostPath:
            path: /var/www/html/.well-known/acme-challenge