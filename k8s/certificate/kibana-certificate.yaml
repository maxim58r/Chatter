apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: kibana-msv-tech-tls
  namespace: logging
spec:
  secretName: kibana-msv-tech-tls
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer
  dnsNames:
    - kibana.msv-tech.ru

