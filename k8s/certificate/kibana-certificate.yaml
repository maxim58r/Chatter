apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: elastic-tls
  namespace: logging
spec:
  secretName: elastic-tls-secret
  duration: 8760h
  renewBefore: 360h
  commonName: msv-tech.ru
  dnsNames:
    - msv-tech.ru
    - elastic-es-http.logging.svc
  issuerRef:
    name: internal-selfsigned
    kind: ClusterIssuer


