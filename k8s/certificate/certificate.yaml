apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: msv-tech-tls
  namespace: keycloak
spec:
  secretName: msv-tech-tls
  dnsNames:
    - msv-tech.ru
    - keycloak.msv-tech.ru
    - kibana.msv-tech.ru
  issuerRef:
    name: letsencrypt-prod
    kind: ClusterIssuer

# kubectl apply -f certificate.yaml
# kubectl get certificate -n keycloak